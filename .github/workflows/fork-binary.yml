name: Fork binary (dispatch)

# Fork-only helper. Builds the `lev` binary from this branch WITHOUT the
# PR's test/coverage/guard gates and WITHOUT any release, tag or publish.
#
# Why it exists: the goal of the fork sync is a fork-built lev on the box,
# not a green PR. alpha.yml cannot serve that - its `build` job needs
# `gate`, `gate` calls ci.yml (test, coverage, guard jobs), and the chain
# ends in a published alpha release. This workflow is the narrow path:
# one ubuntu runner, one `cargo build --release -p leviath-cli`, an archive
# and an artifact. Nothing else.
#
# Manual dispatch only. No push/schedule trigger, so it never runs on its
# own and never touches anything but its own artifacts.

on:
  workflow_dispatch:

# Read-only. This workflow uploads an artifact; it does not write to the
# repository, cut a release or mint a tag.
permissions:
  contents: read

jobs:
  build:
    name: Build lev (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Installs the toolchain rust-toolchain.toml pins and restores the
      # cargo cache. Same composite the repo's other jobs use.
      - uses: ./.github/actions/rust-setup
      # No `RUSTFLAGS: -D warnings` here on purpose: warnings must not be
      # able to turn a build of the branch into a failure. A compile error
      # still fails the job, which is the signal we want.
      - name: Build release binary
        run: cargo build --release -p leviath-cli
      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp target/release/lev staging/lev
          chmod +x staging/lev
          ( cd staging && tar czf ../leviath-linux-x64.tar.gz lev )
          sha256sum leviath-linux-x64.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: leviath-linux-x64
          path: |
            leviath-linux-x64.tar.gz
            SHA256SUMS
          if-no-files-found: error
