}

type OAuthRefreshTokenOutput implements WorkflowStepOutput {
  simpleEnglishDescription: String!
  token: Confidential
  expiresAt: DateTime!
  scope: [String!]!
}

type ModelKeyOutput implements WorkflowStepOutput {
  simpleEnglishDescription: String!
  provider: Provider!
  family: ModelFamily!
  version: String!
}

type JsonPointerOutput implements WorkflowStepOutput {
  simpleEnglishDescription: String!
  pointer: String!
  targetKind: String!
}

type MoneyOutput implements WorkflowStepOutput {
  simpleEnglishDescription: String!
  amount: Decimal!
  currency: ISO4217!
