  """
  Human-readable annotation: search/discovery + authoring (Sept 8 decision).
  """
  simpleEnglishDescription: String!
}

interface WorkflowStepOutput {
  """
  Human-readable annotation: search/discovery + authoring (Sept 8 decision).
  """
  simpleEnglishDescription: String!
}

