# === Types from schema B (not present in A) ===


interface PageConnection {
  pageInfo: PageInfo!
}


interface PageEdge {
  cursor: String!
}

# === Renamed types (B versions) ===


union RoundOutcome = ReviewPending | ApprovalReview | RejectionReview | RevisionRequestReview | ReviewWithdrawal




enum ProposalResource {
  """A proposal aggregate root."""
  PROPOSAL
  """A human identity referenced by a command."""
  HUMAN
  """A reviewer authorization edge."""
  REVIEWER_BINDING
  """A decision option within an immutable choice gate."""
  DECISION_OPTION
}



type ProposalNotFound implements ProposalProblem {
  message: String!
  resource: ProposalResource!
  """Echo of the command's lookup argument, not an output relationship."""
  requestedId: ID!
}



union ProposalResult = Proposal | ProposalNotFound | ProposalConflict | ProposalRuleViolation | InvalidProposalInput




union ReviewerBindingResult = ReviewerBinding | ProposalNotFound | ProposalConflict | ProposalRuleViolation | InvalidProposalInput

