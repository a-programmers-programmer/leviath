#   COST: Name-only edit touching the type and its three union member positions;
#         no fields, no types, no nullability changed.
#   BENEFIT: The type is returned when a HUMAN, REVIEWER_BINDING, or
#         DECISION_OPTION lookup fails (its own enum proves it), so
#         "ProposalNotFound" told clients the wrong thing at the exact moment
#         they were branching on an error.
#
