# ----------------------------------------------------------------------------
# HARD INVARIANTS NOT EXPRESSIBLE IN SDL, documented for the implementer
# (unchanged from the seed; guide 7: these are soft invariants, so they live in
# the resolver and are written down where they bind)
# ----------------------------------------------------------------------------
# - A human has at most one AUTHORIZED binding per proposal. Enforced by the
#   bindReviewer command (ProposalRuleViolation otherwise).
# - A round is opened and closed exactly once; a proposal is AWAITING_REVIEW
#   exactly while its open round's outcome is ReviewPending.
# - ProposalRevision.previous, when non-null, is an earlier revision of the same
#   proposal, and currentRevision tracks the revision of the state's story.
# - ReviewerBinding.state.since equals assignedAt for ReviewerAuthorized.
# - A ChoiceAnswer.option belongs to ChoiceAnswer.gate.
# - Only the author's agent may revise/submit/withdraw; only a human with an
#   AUTHORIZED binding on the proposal may decide a round; only the assigning
#   agent may revoke; the last authorized reviewer cannot be revoked.

# === Types from schema B (not present in A) ===



input ConfirmationGateInput {
  question: String!
  instructions: String
  requestedAction: String!
}



input ChoiceGateInput {
  question: String!
  instructions: String
  """At least two options; labels must be nonblank and distinguishable."""
  options: [DecisionOptionInput!]!
}


enum ProposalResource {
  """proposalId did not resolve to a visible proposal."""
  PROPOSAL
  """reviewerId, or one entry of reviewerIds, did not resolve to a visible human."""
  HUMAN
  """bindingId did not resolve to a visible reviewer binding."""
  REVIEWER_BINDING
  """optionId did not resolve to a visible decision option."""
  DECISION_OPTION
}

# === Renamed types (B versions) ===



type ProposalNotFound implements ProposalProblem {
  message: String!
  resource: ProposalResource!
  """Echo of the command's lookup argument, not an output relationship."""
  requestedId: ID!
}
